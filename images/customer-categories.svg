<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Palantir's customer base by category: government and defense versus commercial</title>
  <desc id="desc2">A two-column diagram grouping named Palantir customers into Government &amp; Defense and Commercial categories, as documented on this page.</desc>
  <rect width="720" height="320" fill="#F5F3EE"/>

  <text x="360" y="34" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#16233A" text-anchor="middle">Palantir's Customer Base, by Category</text>
  <text x="360" y="54" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4B5768" text-anchor="middle">Illustrative grouping of customers named in reporting — not an exhaustive list</text>

  <!-- Government column -->
  <rect x="30" y="74" width="320" height="220" rx="4" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="1.5"/>
  <rect x="30" y="74" width="320" height="7" fill="#16233A"/>
  <text x="190" y="104" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#16233A" text-anchor="middle">Government &amp; Defense</text>

  <g font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#2B2925">
    <circle cx="55" cy="130" r="3" fill="#16233A"/><text x="66" y="134">U.S. Army &amp; U.S. Navy</text>
    <circle cx="55" cy="154" r="3" fill="#16233A"/><text x="66" y="158">U.S. intelligence agencies</text>
    <circle cx="55" cy="178" r="3" fill="#16233A"/><text x="66" y="182">U.S. Immigration &amp; Customs Enforcement</text>
    <circle cx="55" cy="202" r="3" fill="#16233A"/><text x="66" y="206">CDC, NIH, USDA, IRS</text>
    <circle cx="55" cy="226" r="3" fill="#16233A"/><text x="66" y="230">UK Ministry of Defence, NHS</text>
    <circle cx="55" cy="250" r="3" fill="#16233A"/><text x="66" y="254">Allied militaries (Ukraine, Israel)</text>
    <circle cx="55" cy="274" r="3" fill="#16233A"/><text x="66" y="278">Babcock (UK defense contractor)</text>
  </g>

  <!-- Commercial column -->
  <rect x="370" y="74" width="320" height="220" rx="4" fill="#FFFFFF" stroke="#DCE1E8" stroke-width="1.5"/>
  <rect x="370" y="74" width="320" height="7" fill="#C40410"/>
  <text x="530" y="104" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#16233A" text-anchor="middle">Commercial</text>

  <g font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#2B2925">
    <circle cx="395" cy="130" r="3" fill="#C40410"/><text x="406" y="134">Walmart, Amazon</text>
    <circle cx="395" cy="154" r="3" fill="#C40410"/><text x="406" y="158">Airbus, BP</text>
    <circle cx="395" cy="178" r="3" fill="#C40410"/><text x="406" y="182">Thomson Reuters</text>
    <circle cx="395" cy="202" r="3" fill="#C40410"/><text x="406" y="206">Merck KGaA</text>
    <circle cx="395" cy="226" r="3" fill="#C40410"/><text x="406" y="230">U.S. Dept. of Veterans Affairs</text>
    <circle cx="395" cy="250" r="3" fill="#C40410"/><text x="406" y="254">UnitedHealth Group</text>
    <circle cx="395" cy="274" r="3" fill="#C40410"/><text x="406" y="278">Hertz Global, Coca-Cola</text>
  </g>
</svg>
